# Konklav for Kuria's end-to-end tests: its Postgres, its migrations and
# the server, at the Konklav release Kuria pins (=1.7.0).
#
# `mise run e2e` brings this up, seeds it (scripts/setup.ts), runs Kuria
# against it and tears it down. Nothing is kept between runs.
name: kuria-e2e

x-konklav: &konklav
  image: cstruct/konklav:1.7.0
  volumes:
    - ./konklav/config.styx:/etc/konklav/config.styx:ro
    - ./konklav/secrets.styx:/etc/konklav/secrets.styx:ro
    - ./.state/keys:/keys:ro

services:
  postgres:
    # The same image Konklav's own development setup builds; built here
    # from a copy of its Dockerfile where it's missing.
    image: konklav-dev-postgres:18.6-jsonschema0.3.4
    build: ./konklav/postgres
    environment:
      POSTGRES_USER: konklav
      POSTGRES_PASSWORD: konklav
      POSTGRES_DB: konklav
    # Fresh every run.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U konklav -d konklav"]
      interval: 1s
      timeout: 3s
      retries: 60

  migrate:
    <<: *konklav
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  konklav:
    <<: *konklav
    command: ["serve"]
    restart: on-failure
    ports:
      # The subject-facing surface, which Kuria's login page reaches through
      # Kuria's proxy; the relying surface, for Kuria's relying client; and
      # the control plane, for seeding.
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
      - "127.0.0.1:18082:8082"
    healthcheck:
      # The image has no shell or HTTP client; the Kuria side waits on
      # /readyz instead (scripts/setup.ts).
      disable: true
    depends_on:
      migrate: {condition: service_completed_successfully}
