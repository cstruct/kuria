[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy,rust-analyzer,rust-src" }
# The app in items/web, and the end-to-end tests.
node = "24.20.0"
# Tracks the spec in docs/spec against the code, from its GitHub releases.
# 1.1.5: later releases refuse `.svelte` files, where the app's components
# carry their spec references.
"github:bearcove/tracey" = "1.1.5"

[env]
# Below the ephemeral port ranges, and apart from Konklav's development
# Postgres, so both can run at once.
KURIA_DEV_PG_PORT = "15442"
DATABASE_URL = "postgres://kuria:kuria@localhost:{{env.KURIA_DEV_PG_PORT}}/kuria"
# Valkey, which speaks Redis' protocol, reached with a redis:// URL.
KURIA_DEV_VALKEY_PORT = "16389"
KURIA_VALKEY_URL = "redis://localhost:{{env.KURIA_DEV_VALKEY_PORT}}"
# Attachments, in versitygw: an S3-compatible gateway over a local directory.
KURIA_DEV_S3_PORT = "17070"
KURIA_S3_ENDPOINT = "http://localhost:{{env.KURIA_DEV_S3_PORT}}"
KURIA_S3_BUCKET = "kuria"
KURIA_S3_ACCESS_KEY = "kuria"
KURIA_S3_SECRET_KEY = "kuria-dev-only-secret"

[tasks."db:up"]
description = "Start the local Postgres, Valkey and S3 gateway and wait until they accept connections"
run = "docker compose -f dev/compose.yaml up -d --wait"

[tasks."db:down"]
description = "Stop the local services, keeping their data"
run = "docker compose -f dev/compose.yaml down"

[tasks."db:reset"]
description = "Stop the local services and delete their data"
run = "docker compose -f dev/compose.yaml down --volumes"

[tasks."db:psql"]
description = "Open psql against the local database"
run = "docker compose -f dev/compose.yaml exec postgres psql -U kuria -d kuria"

[tasks.build]
description = "Build every crate"
run = "cargo build --workspace"

[tasks.test]
description = "Run every test; database tests use isolated databases on the local Postgres"
depends = ["db:up", "web:install"]
run = ["cargo test --workspace", "npm --prefix items/web test"]

[tasks.lint]
description = "Check formatting, lints and spec traceability"
depends = ["web:install"]
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets -- -D warnings",
    # The app's schema file is what the server serves.
    "cargo run -q -p kuria-server -- schema | diff -u items/web/schema.graphql -",
    "npm --prefix items/web run lint",
    "npm --prefix items/web run check",
    "tracey query validate",
    # Kuria's own plans, once they live in the repository (PLAN-008-T08).
    "test ! -d plans || cargo run -q -p kuria-cli -- check --dir plans",
]

[tasks.kuria]
description = "Run the `kuria` CLI from source, such as `mise run kuria -- whoami` (see items/cli/README.md)"
run = "cargo run -q -p kuria-cli --"

[tasks."cli:install"]
description = "Install the `kuria` CLI into Cargo's bin directory"
run = "cargo install --locked --path items/cli"

[tasks."dogfood:up"]
description = "Start the dogfooding Konklav, keeping its data, and seed it the first time (see dogfood/README.md)"
dir = "dogfood"
run = [
    "node scripts/prepare.ts",
    "docker compose -f compose.yaml up -d --wait --wait-timeout 300 postgres",
    "docker compose -f compose.yaml up -d konklav",
    "node scripts/setup.ts",
]

[tasks."dogfood:serve"]
description = "Run Kuria for dogfooding on http://localhost:18190, keeping its data"
depends = ["db:up", "web:build", "dogfood:up"]
dir = "dogfood"
run = "node scripts/serve.ts"

[tasks.plans]
description = "Run the kuria CLI on Kuria's own plans in plans/, without a server, such as `mise run plans -- ls plan --state active`"
# Paths in its arguments are the caller's.
dir = "{{cwd}}"
quiet = true
env = { KURIA_DIR = "{{config_root}}/plans" }
run = "cargo run -q --manifest-path {{config_root}}/Cargo.toml -p kuria-cli --"

[tasks."dogfood:kuria"]
description = "Run the kuria CLI as the dogfooding agent, such as `mise run dogfood:kuria -- ls plan`"
# Paths in its arguments are the caller's.
dir = "{{cwd}}"
quiet = true
run = "node {{config_root}}/dogfood/scripts/kuria.ts"

[tasks."dogfood:down"]
description = "Stop the dogfooding Konklav, keeping its data"
dir = "dogfood"
run = "docker compose -f compose.yaml stop"

[tasks."dogfood:reset"]
description = "Forget the dogfooding stack: Konklav's data, the kuria_dogfood database and the keys"
dir = "dogfood"
run = [
    "docker compose -f compose.yaml down --volumes",
    "docker compose -f ../dev/compose.yaml exec -T postgres psql -U kuria -d kuria -c 'drop database if exists kuria_dogfood with (force)'",
    "rm -rf .state",
]

[tasks.serve]
description = "Run the server, configured from the environment (see items/server/README.md)"
depends = ["db:up"]
run = "cargo run -q -p kuria-server"

[tasks."web:install"]
description = "Install the app's dependencies from its lockfile"
dir = "items/web"
run = "npm ci --no-audit --no-fund"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."web:schema"]
description = "Write the server's GraphQL schema to items/web/schema.graphql, for the app's types"
run = "cargo run -q -p kuria-server -- schema > items/web/schema.graphql"

[tasks."web:dev"]
description = "Serve the app with Vite on http://localhost:5173, passing the API to `mise run serve`"
depends = ["web:install"]
dir = "items/web"
run = "npm run dev"

[tasks."web:build"]
description = "Build the app into items/web/build, which KURIA_WEB_DIR serves"
depends = ["web:install"]
dir = "items/web"
run = "npm run build"

[tasks."e2e:install"]
description = "Install the end-to-end tests' dependencies and Playwright's Chromium"
dir = "e2e"
run = ["npm ci --no-audit --no-fund", "npx playwright install chromium"]
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."e2e:up"]
description = "Start and seed the end-to-end Konklav (cstruct/konklav:1.8.0)"
depends = ["e2e:install"]
dir = "e2e"
run = [
    "node scripts/keys.ts",
    # Seeding runs once against an empty Konklav.
    "docker compose -f compose.yaml down --volumes",
    "docker compose -f compose.yaml up -d --wait --wait-timeout 300 postgres",
    "docker compose -f compose.yaml up -d konklav",
    "node scripts/setup.ts",
]

[tasks."e2e:down"]
description = "Stop the end-to-end Konklav and forget it"
dir = "e2e"
run = "docker compose -f compose.yaml down --volumes"

[tasks.e2e]
description = "Run the end-to-end tests: a seeded Konklav, the Kuria server serving the built app, and Playwright"
depends = ["db:up", "web:build", "e2e:up"]
dir = "e2e"
run = "npx playwright test"

[tasks."e2e:serve"]
description = "Run Kuria against a fresh, seeded Konklav with the release-management example's akt types, to click around in on http://localhost:18090"
depends = ["db:up", "web:build", "e2e:up"]
dir = "e2e"
run = "node scripts/explore.ts"

[tasks."e2e:walk"]
description = "Run the release walkthrough against the server `mise run e2e:serve` runs, leaving its release behind"
dir = "e2e"
env = { KURIA_E2E_EXISTING = "1" }
run = "npx playwright test tests/release-flow.spec.ts"

[tasks."e2e:screenshots"]
description = "Take items/web/README.md's screenshots from the server `mise run e2e:serve` runs, after `mise run e2e:walk`"
dir = "e2e"
run = "node scripts/screenshots.ts"
