name: kuria-dev

services:
  postgres:
    # Postgres with pg_search, for text search (dev/postgres/Dockerfile).
    image: kuria-dev-postgres:18.6-pgsearch0.27.0
    build: ./postgres
    environment:
      POSTGRES_USER: kuria
      POSTGRES_PASSWORD: kuria
      POSTGRES_DB: kuria
    ports:
      - "${KURIA_DEV_PG_PORT:-15442}:5432"
    # Postgres 18 images keep data in a versioned directory below
    # /var/lib/postgresql, so the volume is mounted there.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuria -d kuria"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Shared, short-lived state: rate limits now, live change events later.
  # Nothing in it is a record, so nothing is persisted.
  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${KURIA_DEV_VALKEY_PORT:-16389}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Attachments: an S3-compatible gateway over a local directory. The
  # `kuria` bucket is a directory under /data, made before it starts.
  s3:
    image: versity/versitygw:v1.10.0
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/kuria && exec versitygw posix /data"]
    environment:
      ROOT_ACCESS_KEY: kuria
      ROOT_SECRET_KEY: kuria-dev-only-secret
    ports:
      - "${KURIA_DEV_S3_PORT:-17070}:7070"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7070"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  s3-data:
