[package]
name = "kuria-cli"
description = "kuria: Kuria's command-line client, for people and agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kuria"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
konklav-token = "=1.8.0"
kuria-config = { path = "../config" }
kuria-engine = { path = "../engine" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
regex = "1.13.1"
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-io", "local"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
similar = "3.2.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "io-std"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["serde", "v5"] }
webbrowser = "1"

[dev-dependencies]
axum = "0.8"
konklav-authz = "=1.8.0"
konklav-axum = "=1.8.0"
konklav-relying-client = "=1.8.0"
kuria-server = { path = "../server" }
kuria-test-support = { path = "../test-support" }
kuria-typst = { path = "../typst" }
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints]
workspace = true
