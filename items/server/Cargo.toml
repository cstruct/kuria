[package]
name = "kuria-server"
description = "The Kuria server: GraphQL over HTTP, authenticated through Konklav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
async-stream = "0.3"
async-graphql = { version = "7.2.1", features = ["chrono"] }
async-graphql-axum = "7.2.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
diesel = { version = "2.3", default-features = false, features = ["postgres_backend"] }
diesel-async = { version = "0.9", features = ["postgres"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
konklav-authz = "=1.7.0"
konklav-axum = "=1.7.0"
konklav-core = "=1.7.0"
konklav-relying = "=1.7.0"
konklav-relying-client = { version = "=1.7.0", features = ["redis"] }
konklav-token = "=1.7.0"
kuria-config = { path = "../config" }
kuria-engine = { path = "../engine" }
kuria-store = { path = "../store" }
object_store = { version = "0.14.2", features = ["aws"] }
percent-encoding = "2.3"
redis = { version = "1.8", default-features = false, features = ["connection-manager", "tokio-comp", "streams"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1.5"
konklav-authz = "=1.7.0"
kuria-test-support = { path = "../test-support" }
serde_json = "1.0.154"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
