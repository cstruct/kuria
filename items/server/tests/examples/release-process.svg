<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 640 120" font-family="sans-serif" font-size="14">
  <title>The release process</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <g fill="#eef3fb" stroke="#3b6db3" stroke-width="2">
    <rect x="10" y="40" width="120" height="40" rx="8"/>
    <rect x="170" y="40" width="120" height="40" rx="8"/>
    <rect x="330" y="40" width="120" height="40" rx="8"/>
    <rect x="490" y="40" width="120" height="40" rx="8"/>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#arrow)">
    <line x1="130" y1="60" x2="168" y2="60"/>
    <line x1="290" y1="60" x2="328" y2="60"/>
    <line x1="450" y1="60" x2="488" y2="60"/>
  </g>
  <g text-anchor="middle" fill="#1a2b44">
    <text x="70" y="65">Planning</text>
    <text x="230" y="65">Testing</text>
    <text x="390" y="65">Released</text>
    <text x="550" y="65">Closed</text>
  </g>
</svg>
