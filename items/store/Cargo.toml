[package]
name = "kuria-store"
description = "Kuria's Postgres storage: the pool, migrations and queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "uuid", "chrono"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "async-connection-wrapper", "migrations"] }
diesel_migrations = { version = "2.3", features = ["postgres"] }
thiserror = "2.0.21"
uuid = "1"

[lints]
workspace = true
