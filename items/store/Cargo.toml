[package]
name = "kuria-store"
description = "Kuria's Postgres storage: the pool, migrations and queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "uuid", "chrono", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "async-connection-wrapper", "migrations"] }
diesel_migrations = { version = "2.3", features = ["postgres"] }
thiserror = "2.0.21"
serde_json = "1.0.154"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
kuria-engine = { path = "../engine" }
kuria-test-support = { path = "../test-support" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
