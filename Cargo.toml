[workspace]
members = ["items/cli", "items/config", "items/engine", "items/server", "items/store", "items/test-support"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
# The linker's notes, such as macOS's on large unwind tables in binaries
# that include typst, are about the platform's linker, not the code.
linker_messages = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
single_match_else = "allow"
